function supplierRows(list){return list.map((s,i)=>`<tr><td><div class="product-name-cell"><div class="avatar" style="border-radius:10px;background:${['#e7eefb','#e7f5f2','#f6f0e4','#f6eaf1'][i%4]};color:#415987">${s.initials}</div><div><div class="cell-main">${esc(s.name)}</div><div class="cell-sub">${esc(s.email)}</div></div></div></td><td>${esc(s.category)}</td><td>${esc(s.contact)}</td><td class="money">${fmt(s.due)}</td><td><span class="status success">${s.status}</span></td><td><div class="table-actions"><button class="mini-icon" onclick="viewSupplier('${esc(s.name)}')">${I('eye')}</button><button class="mini-icon" onclick="supplierModal('${esc(s.name)}')">${I('edit')}</button></div></td></tr>`).join('')}
function filterSuppliers(q){document.getElementById('supplierBody').innerHTML=supplierRows(suppliers.filter(s=>`${s.name} ${s.email} ${s.category}`.toLowerCase().includes(q.toLowerCase())))||'<tr><td colspan="6">No suppliers found.</td></tr>'}
function staffPage(){return `${heading('Staff & access','Give each team member the right access and review their activity.',`<button class="btn" onclick="toast('Role policies are enforced by the backend in a full implementation.')">${I('settings')} Manage roles</button><button class="btn primary" onclick="staffModal()">${I('plus')} Add staff member</button>`)}<div class="grid kpi-grid">${kpi('Team members',team.length,'Including administrators','staff')}${kpi('Active accounts',team.filter(s=>s.status==='Active').length,'Can sign in to the portal','check')}${kpi('Cashiers on shift','2','Illustrative current shift','clock')}${kpi('Bills processed today','81','Across all staff','sales')}</div><section class="panel">${panelHead('Team members','Account status and access role')}<div class="table-wrap"><table><thead><tr><th>Team member</th><th>Role</th><th>Bills today</th><th>Sales today</th><th>Status</th><th>Actions</th></tr></thead><tbody>${team.map(s=>`<tr><td><div class="product-name-cell"><div class="avatar">${s.initials}</div><div><div class="cell-main">${s.name}</div><div class="cell-sub">${s.email}</div></div></div></td><td>${s.role}</td><td>${s.bills}</td><td class="money">${fmt(s.sales)}</td><td><span class="status ${statusClass(s.status)}">${s.status}</span></td><td><button class="mini-icon" onclick="staffModal('${s.email}')">${I('edit')}</button></td></tr>`).join('')}</tbody></table></div></section><section class="panel" style="margin-top:17px">${panelHead('Access principles','Keep high-risk operations restricted and auditable')}<div class="panel-body"><div class="grid report-grid" style="margin-bottom:0"><div class="report-card"><div class="report-icon">${I('cart')}</div><strong>Cashier</strong><p>Find products, create bills, record payments and print receipts.</p><span style="color:var(--green)">${I('check',12)} Standard access</span></div><div class="report-card"><div class="report-icon">${I('returns')}</div><strong>Senior cashier</strong><p>Billing plus policy-based discounts and eligible returns.</p><span style="color:var(--amber)">${I('check',12)} Limited elevated access</span></div><div class="report-card"><div class="report-icon">${I('settings')}</div><strong>Administrator</strong><p>Manage products, stock, staff, suppliers and reporting.</p><span>${I('check',12)} Full management</span></div></div></div></section>`}
function reportsPage(){return `${heading('Reports & insights','Understand what sells, what needs attention and how payments are coming in.',`<select class="select-control" onchange="state.reportRange=this.value;render()"><option ${state.reportRange==='7 days'?'selected':''}>7 days</option><option ${state.reportRange==='30 days'?'selected':''}>30 days</option></select><button class="btn" onclick="exportSales()">${I('download')} Export report</button>`)}<div class="grid kpi-grid">${kpi('Net sales','₹3,26,840','Selected period','sales','9.6%')}${kpi('Units sold','286','Across sample products','products','6.1%')}${kpi('Returns value','₹4,280','Recorded return value','returns')}${kpi('Average bill','₹1,143','Per completed transaction','cart','2.3%')}</div><div class="grid dashboard-grid"><section class="panel">${panelHead('Sales over time','Net sales for '+state.reportRange)}<div class="panel-body">${chart()}</div></section><section class="panel">${panelHead('Sales by category','Contribution to recorded sales')}<div class="panel-body" style="display:grid;gap:15px;padding-top:5px">${[['Shirts',74,'#3159d9'],['Kurtas',59,'#7890ea'],['Bottomwear',48,'#aebcf4'],['Dresses',35,'#d0d9f8'],['Home linen & more',24,'#e5eafb']].map(([n,v,c])=>`<div><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:7px"><span class="muted">${n}</span><strong>${v}%</strong></div><div style="height:7px;background:#eff2f8;border-radius:10px;overflow:hidden"><div style="height:100%;width:${v}%;background:${c}"></div></div></div>`).join('')}</div></section></div><div class="grid report-grid">${[['Sales report','Invoices, discounts, refunds and net sales.','sales'],['Product performance','Quantity and revenue by product or variant.','products'],['Staff performance','Bills processed by cashier.','staff'],['Payment summary','Recorded collections by method.','card'],['Inventory valuation','On-hand stock and indicative value.','inventory'],['Supplier statement','Purchases, payments and balance movement.','suppliers']].map(([t,d,ic])=>`<button class="report-card" onclick="openReport('${t}')"><div class="report-icon">${I(ic)}</div><strong>${t}</strong><p>${d}</p><span>View report ${I('arrowRight',12)}</span></button>`).join('')}</div><div class="callout">Prototype figures are illustrative. Production reports should calculate metrics from saved sales, returns, payments, stock and supplier records with consistent date boundaries.</div>`}
function settingsPage(){return `${heading('Settings','Configure store identity and the defaults used during billing.',`<button class="btn primary" onclick="toast('Settings saved in this concept only.')">${I('check')} Save changes</button>`)}<div class="grid two-col"><section class="panel">${panelHead('Store profile','Shown on receipts and workspace')}<div class="modal-content"><div class="form-grid"><div class="form-field"><label>Store name</label><input value="Loom & Linen"></div><div class="form-field"><label>Store code</label><input value="LL-KKD-01"></div><div class="form-field full"><label>Store address</label><textarea>Beach Road, Kozhikode, Kerala</textarea></div><div class="form-field"><label>Currency</label><select><option>INR — Indian Rupee</option></select></div><div class="form-field"><label>Time zone</label><select><option>Asia/Kolkata (IST)</option></select></div></div></div></section><section class="panel">${panelHead('Billing preferences','Defaults used during checkout')}<div class="modal-content"><div class="form-grid"><div class="form-field full"><label>Invoice prefix</label><input value="LD-"><span class="field-hint">Invoice numbers are generated by the server.</span></div><div class="form-field"><label>Default payment method</label><select><option>Cash</option><option>UPI</option></select></div><div class="form-field"><label>Low-stock alert</label><select><option>At reorder threshold</option></select></div><div class="form-field full"><label>Receipt footer</label><textarea>Thank you for shopping with us.</textarea></div></div></div></section></div>`}
function render(){if(state.mode==='billing'){renderBilling();return}document.body.classList.remove('billing-mode');document.getElementById('sidebar').style.display='';document.getElementById('workspace').style.display='flex';document.getElementById('topbar').style.display='';renderNav();renderTop();let pages={dashboard,products:productPage,inventory:inventoryPage,sales:transactionsPage,returns:returnsPage,suppliers:suppliersPage,staff:staffPage,reports:reportsPage,settings:settingsPage};document.getElementById('main').innerHTML=(pages[state.page]||dashboard)();}
function go(p){state.page=p;state.mode='admin';render();window.scrollTo({top:0,behavior:'smooth'})}function switchMode(m){state.mode=m;render();window.scrollTo({top:0,behavior:'smooth'})}
function modal(title,sub,content,footer='',wide=false){document.getElementById('modalHost').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-header"><div><h3>${title}</h3><p>${sub||''}</p></div><button class="close-modal" aria-label="Close" onclick="closeModal()">${I('x')}</button></header><div class="modal-content">${content}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`;setTimeout(()=>document.querySelector('.modal input,.modal select')?.focus(),50)}function closeModal(){document.getElementById('modalHost').innerHTML=''}
function productModal(id){let p=products.find(x=>x.id===id)||{id:'',name:'',category:'Shirts',sku:'',price:'',cost:'',stock:0,threshold:5,barcode:''};modal(id?'Edit product':'Add a product',id?'Update catalogue information. Existing receipts keep their original values.':'Add the core details required to sell a product.',`<div class="form-grid"><div class="form-field full"><label>Product name *</label><input id="fName" value="${esc(p.name)}" placeholder="Classic Cotton Shirt"></div><div class="form-field"><label>Category *</label><select id="fCat">${['Shirts','Kurtas','Bottomwear','Dresses','Home linen','Accessories'].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="form-field"><label>SKU *</label><input id="fSku" value="${esc(p.sku)}" placeholder="SH-CT-001"></div><div class="form-field"><label>Retail price (₹) *</label><input id="fPrice" type="number" min="0" step=".01" value="${p.price}"></div><div class="form-field"><label>Cost price (₹)</label><input id="fCost" type="number" min="0" step=".01" value="${p.cost}"></div><div class="form-field"><label>Units on hand</label><input id="fStock" type="number" min="0" value="${p.stock}"></div><div class="form-field"><label>Reorder threshold</label><input id="fThreshold" type="number" min="0" value="${p.threshold}"></div><div class="form-field full"><label>Barcode (optional)</label><input id="fBarcode" value="${esc(p.barcode)}" placeholder="Scan or type barcode"></div><div class="form-field full"><span class="field-hint">The production product editor should manage size/colour as separate stock-tracked variant records.</span></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveProduct('${id}')">${I('check')} Save product</button>`,true)}
function saveProduct(id){let name=document.getElementById('fName').value.trim(),sku=document.getElementById('fSku').value.trim(),price=Number(document.getElementById('fPrice').value);if(!name||!sku||!Number.isFinite(price)||price<0){toast('Enter a product name, SKU and valid price.');return}let p=products.find(x=>x.id===id);if(!p){p={id:'P-'+String(1010+products.length),name,category:'Shirts',sku,price,cost:0,stock:0,threshold:5,emoji:'👕',bg:'#eaf0f8',sizes:['S','M','L'],colors:['Blue','White'],barcode:''};products.unshift(p)}Object.assign(p,{name,category:document.getElementById('fCat').value,sku,price,cost:Number(document.getElementById('fCost').value||0),stock:Math.max(0,Number(document.getElementById('fStock').value||0)),threshold:Math.max(0,Number(document.getElementById('fThreshold').value||0)),barcode:document.getElementById('fBarcode').value.trim()});closeModal();render();toast(id?'Product updated.':'Product added to catalogue.')}
function viewProduct(id){let p=products.find(x=>x.id===id);modal(p.name,'Product summary',`<div class="product-name-cell" style="margin-bottom:15px"><div class="product-thumb" style="width:55px;height:58px;background:${p.bg};font-size:27px">${productArt(p)}</div><div><div class="cell-main">${p.category} · ${p.sku}</div><div style="font-size:16px;font-weight:760;margin-top:7px">${fmt(p.price)}</div></div></div><div class="summary-strip" style="grid-template-columns:1fr 1fr"><div class="summary-tile"><span>On hand</span><strong>${p.stock}</strong></div><div class="summary-tile"><span>Reorder at</span><strong>${p.threshold}</strong></div></div><div class="form-field"><label>Variants in catalogue</label><input readonly value="${p.sizes.join(', ')} / ${p.colors.join(', ')}"></div>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();productModal('${id}')">${I('edit')} Edit product</button>`)}
function stockModal(){modal('Adjust stock','Record a correction with a clear reason.',`<div class="form-grid"><div class="form-field full"><label>Product</label><select id="stockProduct">${products.map(p=>`<option value="${p.id}">${p.name} — ${p.sku} (on hand: ${p.stock})</option>`).join('')}</select></div><div class="form-field"><label>Adjustment type</label><select id="stockType"><option value="add">Add stock</option><option value="remove">Remove stock</option><option value="set">Set exact quantity</option></select></div><div class="form-field"><label>Quantity</label><input id="stockQty" type="number" min="0" value="1"></div><div class="form-field full"><label>Reason</label><select id="stockReason"><option>Stock count correction</option><option>Damaged goods</option><option>Opening stock</option><option>Supplier receipt</option><option>Other</option></select></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveStock()">Record adjustment</button>`)}
function saveStock(){let p=products.find(x=>x.id===document.getElementById('stockProduct').value),n=Number(document.getElementById('stockQty').value),t=document.getElementById('stockType').value,next=t==='add'?p.stock+n:t==='remove'?p.stock-n:n;if(!Number.isInteger(n)||n<0||next<0){toast('Enter a valid quantity; stock cannot become negative.');return}p.stock=next;closeModal();render();toast('Stock updated in this prototype; production must also write StockMovement and AuditLog records.')}
function supplierModal(name){let s=suppliers.find(x=>x.name===name)||{name:'',category:'Apparel & fabric',contact:'',email:'',due:0,status:'Active',initials:''};modal(name?'Edit supplier':'Add supplier','Maintain contacts; supplier balances should come from purchase and payment entries.',`<div class="form-grid"><div class="form-field full"><label>Supplier name *</label><input id="sName" value="${esc(s.name)}"></div><div class="form-field"><label>Category</label><select id="sCategory">${['Apparel & fabric','Cotton basics','Denim & bottoms','Linen garments','Accessories','Other'].map(c=>`<option ${s.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="form-field"><label>Contact number</label><input id="sContact" value="${esc(s.contact)}"></div><div class="form-field full"><label>Email</label><input type="email" id="sEmail" value="${esc(s.email)}"></div><div class="form-field full"><span class="field-hint">Do not let an ordinary form overwrite a derived financial balance.</span></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSupplier('${esc(name||'')}')">Save supplier</button>`)}
function saveSupplier(orig){let name=document.getElementById('sName').value.trim();if(!name){toast('Supplier name is required.');return}let s=suppliers.find(x=>x.name===orig);if(!s){s={name,category:'Other',contact:'',email:'',due:0,status:'Active',initials:''};suppliers.unshift(s)}Object.assign(s,{name,category:document.getElementById('sCategory').value,contact:document.getElementById('sContact').value,email:document.getElementById('sEmail').value,initials:name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()});closeModal();render();toast(orig?'Supplier updated.':'Supplier added.')}
function viewSupplier(name){let s=suppliers.find(x=>x.name===name);if(!s)return;modal(s.name,'Supplier profile',`<div class="summary-strip" style="grid-template-columns:1fr 1fr"><div class="summary-tile"><span>Recorded amount due</span><strong>${fmt(s.due)}</strong><small>Derived from ledger entries in production</small></div><div class="summary-tile"><span>Supplier status</span><strong style="font-size:15px;color:var(--green)">${s.status}</strong><small>${s.category}</small></div></div><div class="form-grid"><div class="form-field full"><label>Contact</label><input readonly value="${esc(s.contact)}"></div><div class="form-field full"><label>Email</label><input readonly value="${esc(s.email)}"></div></div><div class="callout" style="margin-top:14px">A supplier statement should show dates, invoice references, purchases, credits, payments and a running balance.</div>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();supplierModal('${s.name.replace(/'/g,"\\'")}')">${I('edit')} Edit details</button>`)}
function staffModal(email){let s=team.find(x=>x.email===email)||{name:'',email:'',role:'Cashier',status:'Active',initials:'ST',bills:0,sales:0};modal(email?'Edit team member':'Add staff member','Access must be enforced by the server, not only hidden in the UI.',`<div class="form-grid"><div class="form-field full"><label>Full name *</label><input id="tName" value="${esc(s.name)}"></div><div class="form-field full"><label>Email address *</label><input type="email" id="tEmail" value="${esc(s.email)}"></div><div class="form-field"><label>Role</label><select id="tRole">${['Cashier','Senior cashier','Admin'].map(r=>`<option ${s.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="form-field"><label>Status</label><select id="tStatus"><option ${s.status==='Active'?'selected':''}>Active</option><option ${s.status==='Inactive'?'selected':''}>Inactive</option></select></div><div class="form-field full"><span class="field-hint">Production invite flow should use a secure activation link or one-time password. Never display stored passwords.</span></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveStaff('${esc(email||'')}')">Save account</button>`)}
function saveStaff(orig){let name=document.getElementById('tName').value.trim(),email=document.getElementById('tEmail').value.trim();if(!name||!email.includes('@')){toast('Enter a name and valid email address.');return}let s=team.find(x=>x.email===orig);if(!s){s={name,email,role:'Cashier',status:'Active',initials:'ST',bills:0,sales:0};team.unshift(s)}Object.assign(s,{name,email,role:document.getElementById('tRole').value,status:document.getElementById('tStatus').value,initials:name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()});closeModal();render();toast(orig?'Staff account updated.':'Staff member added.')}
function returnModal(){modal('Create a return','Start from the original invoice so the system can check eligibility.',`<div class="form-grid"><div class="form-field full"><label>Original invoice *</label><select id="rInvoice">${sales.filter(s=>s.status==='Paid').map(s=>`<option value="${s.id}">${s.id} — ${esc(s.customer)} — ${fmt(s.amount)}</option>`).join('')}</select></div><div class="form-field full"><label>Item to return *</label><select id="rItem"><option>Classic Cotton Shirt — Size M</option><option>Soft Cotton Towel — Standard</option><option>Everyday Linen Kurta — Size L</option></select></div><div class="form-field"><label>Quantity</label><input id="rQty" type="number" min="1" value="1"></div><div class="form-field"><label>Disposition</label><select id="rDisposition"><option value="restock">Return to sellable stock</option><option value="damaged">Mark as damaged</option><option value="inspect">Hold for inspection</option></select></div><div class="form-field full"><label>Reason</label><select id="rReason"><option>Changed mind</option><option>Wrong size</option><option>Damaged item</option><option>Wrong item supplied</option><option>Other</option></select></div><div class="form-field full"><label>Refund method</label><select id="rMethod"><option>Original payment method</option><option>Cash</option><option>UPI</option></select></div></div><div class="modal-alert" style="margin-top:14px">Prototype note: the real backend must validate previously returned quantities and refund amounts.</div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveReturn()">Review & record return</button>`,true)}
function saveReturn(){let invoice=document.getElementById('rInvoice').value,item=document.getElementById('rItem').value,qty=Number(document.getElementById('rQty').value),reason=document.getElementById('rReason').value;if(!Number.isInteger(qty)||qty<1){toast('Enter a valid whole-number quantity.');return}let productName=item.split(' — ')[0],amount=(productName.includes('Towel')?449:productName.includes('Kurta')?1490:1199)*qty,r={id:'RT-'+String(129+returns.length).padStart(5,'0'),invoice,customer:sales.find(s=>s.id===invoice)?.customer||'Walk-in customer',item:productName,qty,amount,reason,status:'Completed',date:'19 Oct, just now'};returns.unshift(r);let p=products.find(x=>x.name===productName);if(p&&document.getElementById('rDisposition').value==='restock')p.stock+=qty;closeModal();render();toast('Return recorded in demo. The full system must validate invoice eligibility and refund confirmation.')}

function viewSale(id){let s=sales.find(x=>x.id===id);if(!s){toast('Invoice is not in the demo data.');return}modal('Invoice '+s.id,'Transaction detail · '+s.date,`<div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:17px"><div><div class="cell-main">${esc(s.customer)}</div><div class="cell-sub">Served by ${s.staff}</div></div><span class="status ${statusClass(s.status)}">${s.status}</span></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Qty</th><th>Line total</th></tr></thead><tbody><tr><td><div class="cell-main">${s.items>1?'Mixed retail items':'Retail item'}</div><div class="cell-sub">Line detail simulated in this preview</div></td><td>${s.items}</td><td class="money">${fmt(s.amount)}</td></tr></tbody></table></div><div style="padding-top:16px;display:grid;gap:9px"><div class="sum-row"><span>Payment method</span><strong>${s.payment}</strong></div><div class="sum-row"><span>Status</span><strong>${s.status}</strong></div><div class="sum-total"><span>Invoice total</span><strong>${fmt(s.amount)}</strong></div></div><div class="callout" style="margin-top:14px">The complete application should load original line snapshots, discounts, tax breakdown and payment references from saved records.</div>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn" onclick="closeModal();returnModal()">${I('returns')} Start return</button><button class="btn primary" onclick="printInvoice('${s.id}')">${I('printer')} Print receipt</button>`,true)}

const cats=['All','Shirts','Kurtas','Bottomwear','Dresses','Home linen','Accessories'];
function renderBilling(){document.body.classList.add('billing-mode');document.getElementById('sidebar').style.display='none';document.getElementById('topbar').style.display='none';document.getElementById('workspace').style.display='block';document.getElementById('main').className='main-content';document.getElementById('main').innerHTML=`<div class="billing-shell"><header class="billing-topbar"><div class="brand"><div class="brand-mark">${I('logo')}</div><div><div class="brand-name">loomdesk</div><div class="brand-sub">Retail checkout</div></div></div><div class="billing-register"><span class="register-dot"></span><div><strong>Register 01 · Main Store</strong><span>Open session · Started 9:02 AM</span></div></div><div class="billing-actions"><button class="btn" onclick="openMobilePreview()">${I('bag')} Mobile admin</button><button class="btn" onclick="switchMode('admin')">${I('dashboard')} Admin portal</button></div><div class="billing-user"><div class="avatar">AP</div><div><strong>Anjali Prakash</strong><span>Cashier</span></div></div></header><div class="billing-layout"><section class="catalog-area"><div class="billing-title-row"><div><h1>New sale</h1><p>Find an item, choose the right variant and build the bill.</p></div><span class="register-chip">${I('check',12)} Register ready</span></div><label class="catalog-search">${I('search')}<input id="catalogSearch" value="${esc(state.catalogQuery)}" placeholder="Search by product name, SKU or barcode…" oninput="state.catalogQuery=this.value;renderCatalog()"><button class="scan-button" type="button" title="Barcode scanner" aria-label="Barcode scanner" onclick="showScannerStatus()">${I('scan',17)}</button></label><div class="category-row">${cats.map(c=>`<button class="category-chip ${state.category===c?'active':''}" onclick="state.category='${c}';renderBilling()">${c}</button>`).join('')}</div><div class="catalog-meta"><strong>Choose a product</strong><span id="catalogCount">${products.length} items available</span></div><div class="product-grid" id="catalogGrid">${catalogCards()}</div></section><aside class="cart-panel"><div class="cart-header"><h2>Current bill</h2><span class="cart-count" id="cartCount">${cartUnits()} items</span></div><div class="customer-row"><div style="color:#8692a5">${I('staff')}</div><div class="customer-label"><strong>${esc(state.cartCustomer||'Walk-in customer')}</strong><span>${state.cartCustomer?'Customer selected':'No customer attached'}</span></div><button onclick="chooseCustomer()">${state.cartCustomer?'Change':'Add'}</button></div><div class="cart-items" id="cartItems">${cartMarkup()}</div><div class="cart-summary" id="cartSummary">${summaryMarkup()}</div></aside></div></div>`}
function catalogCards(){let q=(state.catalogQuery||'').toLowerCase(),list=products.filter(p=>(state.category==='All'||p.category===state.category)&&(!q||`${p.name} ${p.sku} ${p.barcode}`.toLowerCase().includes(q)));return list.map(p=>`<article class="catalog-card"><div class="catalog-art" style="background:${p.bg}"><span class="sku-tag">${p.sku}</span><span class="art-emoji">${productArt(p)}</span><div class="color-tags">${p.colors.slice(0,3).map(c=>`<span class="color-swatch" title="${c}" style="background:${({'Blue':'#536cc8','White':'#fff','Black':'#242a34','Sage':'#9cb7a3','Ivory':'#e9e1ca','Indigo':'#324c91','Rose':'#ce8ba0','Navy':'#24365e','Grey':'#a8b0bd','Sand':'#d8c6a1','Olive':'#7a8250','Lilac':'#b6a2d6','Khaki':'#baaa88','Coral':'#de877f'})[c]||'#a0aac0'}"></span>`).join('')}</div></div><div class="catalog-body"><div class="category">${p.category} · <span style="color:${p.stock<=p.threshold?'var(--amber)':'var(--green)'}">${p.stock<=p.threshold?'Low stock':'Available'}</span></div><h3>${esc(p.name)}</h3><div class="catalog-price-row"><div><div class="catalog-price">${fmt(p.price)}</div><div class="catalog-stock">${p.stock} units in stock</div></div><button class="add-circle" aria-label="Add ${esc(p.name)}" onclick="variantModal('${p.id}')">${I('plus')}</button></div></div></article>`).join('')||'<div class="empty-state" style="grid-column:1/-1"><strong>No products found</strong><p>Try another name, SKU or category.</p></div>'}
function renderCatalog(){let g=document.getElementById('catalogGrid');if(!g)return;g.innerHTML=catalogCards();document.getElementById('catalogCount').textContent=products.filter(p=>(state.category==='All'||p.category===state.category)&&(!state.catalogQuery||`${p.name} ${p.sku} ${p.barcode}`.toLowerCase().includes(state.catalogQuery.toLowerCase()))).length+' items available'}
function cartUnits(){return state.cart.reduce((n,c)=>n+c.qty,0)}function cartSubtotal(){return state.cart.reduce((n,c)=>n+c.price*c.qty,0)}function cartTax(){return Math.round(cartSubtotal()*.05*100)/100}function cartTotal(){return Math.round((cartSubtotal()+cartTax())*100)/100}
function cartMarkup(){if(!state.cart.length)return `<div class="cart-empty"><div class="empty-bag">${I('bag')}</div><strong>Your bill is empty</strong><p>Add a product from the catalogue to begin. Your items will appear here.</p></div>`;return state.cart.map((c,i)=>`<div class="cart-line"><div class="cart-line-art" style="background:${c.bg}">${productArt(c)}</div><div class="cart-line-meta"><div class="cart-line-title">${esc(c.name)}</div><div class="cart-line-variant">${esc(c.color)} · ${esc(c.size)} · ${fmt(c.price)} each</div><div class="cart-line-bottom"><div class="quantity-control"><button aria-label="Decrease quantity" onclick="changeQty(${i},-1)">${I('x',11)}</button><span>${c.qty}</span><button aria-label="Increase quantity" onclick="changeQty(${i},1)">${I('plus',11)}</button></div><strong class="cart-line-total">${fmt(c.qty*c.price)}</strong></div></div></div>`).join('')}
function summaryMarkup(){return `<div class="discount-row"><span>Discount ${billDiscount?`· ${fmt(billDiscount)}`:''}</span><button onclick="discountModal()">${I('plus',12)} ${billDiscount?'Edit':'Add discount'}</button></div><div class="sum-row"><span>Subtotal</span><strong>${fmt(cartSubtotal())}</strong></div><div class="sum-row"><span>Estimated tax <span style="font-size:9px;color:#9aa4b4">(5% demo rate)</span></span><strong>${fmt(cartTax())}</strong></div><div class="sum-total"><span>Total due</span><strong>${fmt(Math.max(0,cartTotal()-billDiscount))}</strong></div><button class="checkout-button" ${state.cart.length?'':'disabled'} onclick="paymentModal()">Continue to payment ${I('arrowRight')}</button><div class="cart-footnote">Prices and tax are confirmed by the server in production.</div>`}
function updateCart(){let items=document.getElementById('cartItems');if(!items)return;items.innerHTML=cartMarkup();document.getElementById('cartCount').textContent=cartUnits()+' items';document.getElementById('cartSummary').innerHTML=summaryMarkup()}
function variantModal(id){let p=products.find(x=>x.id===id);if(!p)return;if(p.stock<=0){toast('This item is out of stock.');return}modal('Choose item variant',p.name+' · '+fmt(p.price),`<div class="product-name-cell" style="margin-bottom:17px"><div class="product-thumb" style="width:54px;height:57px;background:${p.bg};font-size:26px">${productArt(p)}</div><div><div class="cell-main">${p.name}</div><div class="cell-sub">${p.sku} · ${p.stock} available</div><div style="font-weight:760;font-size:15px;margin-top:5px">${fmt(p.price)}</div></div></div><div class="variant-options"><div class="option-group"><label>Size / option</label><div class="option-chips">${p.sizes.map((s,i)=>`<button class="option-chip ${i===Math.min(1,p.sizes.length-1)?'active':''}" data-size="${s}" onclick="selectChip(this)">${s}</button>`).join('')}</div></div><div class="option-group"><label>Colour</label><div class="option-chips">${p.colors.map((c,i)=>`<button class="option-chip ${i===0?'active':''}" data-color="${c}" onclick="selectChip(this)">${c}</button>`).join('')}</div></div><div class="form-field"><label>Quantity</label><input id="variantQty" type="number" min="1" max="${p.stock}" value="1"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addToCart('${p.id}')">${I('plus')} Add to bill</button>`)}
function selectChip(b){b.parentElement.querySelectorAll('.option-chip').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function addToCart(id){let p=products.find(x=>x.id===id),size=document.querySelector('[data-size].active')?.dataset.size||p.sizes[0],color=document.querySelector('[data-color].active')?.dataset.color||p.colors[0],qty=Number(document.getElementById('variantQty').value||1),already=state.cart.filter(c=>c.id===id).reduce((n,c)=>n+c.qty,0);if(!Number.isInteger(qty)||qty<1||already+qty>p.stock){toast('Quantity exceeds available stock.');return}let key=id+'|'+size+'|'+color,ex=state.cart.find(c=>c.key===key);if(ex)ex.qty+=qty;else state.cart.push({key,id,name:p.name,price:p.price,qty,size,color,emoji:p.emoji,bg:p.bg,sku:p.sku});closeModal();renderBilling();toast(p.name+' added to bill.')}
function changeQty(i,d){let c=state.cart[i],p=products.find(x=>x.id===c.id);if(!c)return;if(d<0&&c.qty===1)state.cart.splice(i,1);else if(d>0&&state.cart.filter(x=>x.id===c.id).reduce((n,x)=>n+x.qty,0)>=p.stock){toast('Available stock limit reached.');return}else c.qty+=d;updateCart()}
function chooseCustomer(){modal('Attach a customer','Customer selection is optional for a walk-in sale.',`<div class="form-field"><label>Search customer</label><input placeholder="Name or phone number"></div><div class="phone-panel" style="margin-top:14px"><div class="phone-list-row" onclick="selectCustomer('Aparna Menon')" style="cursor:pointer"><div class="avatar">AM</div><div class="phone-row-meta"><strong>Aparna Menon</strong><span>+91 98765 43210 · Regular customer</span></div><button class="text-link">Select</button></div><div class="phone-list-row" onclick="selectCustomer('Nikhil Das')" style="cursor:pointer"><div class="avatar">ND</div><div class="phone-row-meta"><strong>Nikhil Das</strong><span>+91 98765 43211</span></div><button class="text-link">Select</button></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn" onclick="selectCustomer('')">Continue as walk-in</button>`)}

function applyDiscount(){let n=Number(document.getElementById('discountValue').value||0),type=document.getElementById('discountType').value;billDiscount=Math.min(cartSubtotal(),Math.max(0,type==='percent'?Math.min(100,n)/100*cartSubtotal():n));closeModal();renderBilling();toast('Discount applied to the demo bill.')}

function handleGlobalSearch(value){let q=(value||'').trim();if(!q)return;let lower=q.toLowerCase();if(products.some(p=>`${p.name} ${p.sku} ${p.barcode}`.toLowerCase().includes(lower))){state.productQuery=q;go('products');return}if(sales.some(s=>`${s.id} ${s.customer} ${s.staff}`.toLowerCase().includes(lower))){state.salesQuery=q;go('sales');return}if(suppliers.some(s=>`${s.name} ${s.contact}`.toLowerCase().includes(lower))){go('suppliers');toast('Use the supplier search field to narrow the list.');return}toast('No matching product or transaction found in the demo data.')}
