              $ref: '#/components/schemas/CancelPurchaseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelPurchaseRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
          description: ''
  /api/v1/suppliers/purchases/{number}/receive/:
    post:
      operationId: suppliers_purchases_receive_create
      description: 'Receive the goods: every line is added to stock once, as purchase
        movements referencing this purchase.'
      parameters:
      - in: path
        name: number
        schema:
          type: string
        required: true
      tags:
      - suppliers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
          description: ''
  /api/v1/suppliers/purchases/quote/:
    post:
      operationId: suppliers_purchases_quote_create
      description: Price purchase lines without saving, so the form shows the server's
        own totals.
      tags:
      - suppliers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseLinesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PurchaseLinesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PurchaseLinesRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseQuote'
          description: ''
components:
  schemas:
    ActiveStatusEnum:
      enum:
      - active
      - inactive
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
    Approver:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - full_name
      - id
      - role
    BillLineInputRequest:
      type: object
      properties:
        variant:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 999
          minimum: 1
      required:
      - quantity
      - variant
    BillRequest:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BillLineInputRequest'
        discount:
          allOf:
          - $ref: '#/components/schemas/DiscountInputRequest'
          nullable: true
      required:
      - lines
    BillingCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    BillingSettings:
      type: object
      description: What the till needs to know about the store. No GSTIN, address
        or other admin settings.
      properties:
        store_name:
          type: string
        store_code:
          type: string
        prices_include_tax:
          type: boolean
        cashier_discount_limit_pct:
          type: integer
      required:
      - cashier_discount_limit_pct
      - prices_include_tax
      - store_code
      - store_name
    CancelPurchaseRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - reason
    CashierSummary:
      type: object
      properties:
        sale_count:
          type: integer
        total_paise:
          type: integer
        cashier:
          type: integer
        cashier_name:
          type: string
      required:
      - cashier
      - cashier_name
      - sale_count
      - total_paise
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        hsn_code:
          type: string
          readOnly: true
        tax_rule:
          allOf:
          - $ref: '#/components/schemas/TaxRule'
          readOnly: true
      required:
      - hsn_code
      - id
      - name
      - tax_rule
    CategoryRef:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    CheckoutRequest:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BillLineInputRequest'
        discount:
          allOf:
          - $ref: '#/components/schemas/DiscountInputRequest'
          nullable: true
        payment:
          $ref: '#/components/schemas/PaymentInputRequest'
        expected_total_paise:
          type: integer
          minimum: 0
        approver_id:
          type: integer
          nullable: true
        approval_pin:
          writeOnly: true
          oneOf:
          - type: string
            pattern: ^\d{4,6}$
          - type: string
            maxLength: 0
      required:
      - expected_total_paise
      - lines
      - payment
    DaySummary:
      type: object
      properties:
        sale_count:
          type: integer
        total_paise:
          type: integer
        date:
          type: string
          format: date
      required:
      - date
      - sale_count
      - total_paise
    DiscountInputRequest:
      type: object
      description: '`amount` is paise; `percent` is basis points (1000 = 10%).'
      properties:
        kind:
          $ref: '#/components/schemas/DiscountKindEnum'
        value:
          type: integer
          minimum: 0
      required:
      - kind
      - value
    DiscountKindEnum:
      enum:
      - amount
      - percent
      type: string
      description: |-
        * `amount` - amount
        * `percent` - percent
    InventoryMovement:
      type: object
      description: One entry of the append-only stock ledger.
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/StockMovementTypeEnum'
          readOnly: true
        type_label:
          type: string
          readOnly: true
        quantity_delta:
          type: integer
          readOnly: true
        balance_after:
          type: integer
          readOnly: true
        reason:
          type: string
          readOnly: true
        reference:
          type: string
          readOnly: true
        actor_name:
          type: string
          nullable: true
          readOnly: true
        variant:
          allOf:
          - $ref: '#/components/schemas/MovementVariant'
          readOnly: true
      required:
      - actor_name
      - balance_after
      - created_at
      - id
      - quantity_delta
      - reason
      - reference
      - type
      - type_label
      - variant
    InventoryProduct:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: string
        status:
          type: string
        category:
          type: string
        image_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - category
      - id
      - image_url
      - name
      - sku
      - status
    InventorySummary:
      type: object
      properties:
        tracked_variants:
          type: integer
          description: Active variants of active products.
        low_stock:
          type: integer
          description: Tracked variants with 1 to reorder-level units.
        out_of_stock:
          type: integer
          description: Tracked variants with no units.
        units_on_hand:
          type: integer
          description: Units across tracked variants.
      required:
      - low_stock
      - out_of_stock
      - tracked_variants
      - units_on_hand
    InventoryVariant:
      type: object
      description: A stock-tracked variant with its product, stock state and most
        recent movement.
      properties:
        id:
          type: integer
          readOnly: true
        sku:
          type: string
          readOnly: true
        size:
          type: string
          readOnly: true
        colour:
          type: string
          readOnly: true
        barcode:
          type: string
          readOnly: true
          nullable: true
        on_hand:
          type: integer
          readOnly: true
        reorder_level:
          type: integer
          readOnly: true
        stock_state:
          allOf:
          - $ref: '#/components/schemas/StockStateEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        sellable:
          type: boolean
          readOnly: true
          description: Active variant of an active product.
        product:
          allOf:
          - $ref: '#/components/schemas/InventoryProduct'
          readOnly: true
        product_on_hand:
          type: integer
          readOnly: true
          description: Units across all of the product's variants.
        last_movement_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_movement_type:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/StockMovementTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - barcode
      - colour
      - id
      - is_active
      - last_movement_at
      - last_movement_type
      - on_hand
      - product
      - product_on_hand
      - reorder_level
      - sellable
      - size
      - sku
      - stock_state
    LoginRequest:
