openapi: 3.0.3
info:
  title: LoomDesk POS API
  version: 1.0.0
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the csrftoken cookie so the SPA can make its first unsafe
        request (login).
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/session/:
    get:
      operationId: auth_session_retrieve
      description: |-
        Who is signed in, if anyone. Always 200 so the app's startup check isn't an error.

        Anonymous callers learn nothing beyond `user: null`; protected endpoints, including
        `me/`, still refuse them. Also sets the csrftoken cookie, so login needs no extra request.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/billing/approvers/:
    get:
      operationId: billing_approvers_list
      description: Who can approve a discount above a cashier's limit.
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Approver'
          description: ''
  /api/v1/billing/categories/:
    get:
      operationId: billing_categories_list
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BillingCategory'
          description: ''
  /api/v1/billing/products/:
    get:
      operationId: billing_products_list
      description: |-
        What the till can sell: active products with at least one active variant, and only those variants.

        Separate from the admin catalogue (which shows cost prices and inactive items) so cashiers see
        nothing beyond what they need to bill.
      parameters:
      - in: query
        name: category
        schema:
          type: number
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Name, SKU or exact barcode
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSellableProductList'
          description: ''
  /api/v1/billing/settings/:
    get:
      operationId: billing_settings_retrieve
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSettings'
          description: ''
  /api/v1/catalog/categories/:
    get:
      operationId: catalog_categories_list
      description: Categories with their HSN code and tax rule, for the product form
        and catalogue filter.
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/catalog/products/:
    get:
      operationId: catalog_products_list
      description: Admin catalogue. Products are deactivated, never deleted, so sales
        and stock history keep their links.
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -name
            - -price
            - -sku
            - -stock
            - -updated
            - name
            - price
            - sku
            - stock
            - updated
        description: |-
          Ordering

          * `name` - Name
          * `-name` - Name (descending)
          * `sku` - Sku
          * `-sku` - Sku (descending)
          * `price` - Price
          * `-price` - Price (descending)
          * `stock` - Stock
          * `-stock` - Stock (descending)
          * `updated` - Updated
          * `-updated` - Updated (descending)
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Name, product or variant SKU, or barcode
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - inactive
        description: |-
          * `active` - Active
          * `inactive` - Inactive
      - in: query
        name: stock
        schema:
          type: string
          enum:
          - in_stock
          - low_stock
          - out_of_stock
        description: |-
          * `in_stock` - In stock
          * `low_stock` - Low stock
          * `out_of_stock` - Out of stock
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
    post:
      operationId: catalog_products_create
      description: Admin catalogue. Products are deactivated, never deleted, so sales
        and stock history keep their links.
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /api/v1/catalog/products/{id}/:
    get:
      operationId: catalog_products_retrieve
      description: Admin catalogue. Products are deactivated, never deleted, so sales
        and stock history keep their links.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
    patch:
      operationId: catalog_products_partial_update
      description: Admin catalogue. Products are deactivated, never deleted, so sales
        and stock history keep their links.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /api/v1/catalog/products/{id}/image/:
    post:
      operationId: catalog_products_image_create
      description: Admin catalogue. Products are deactivated, never deleted, so sales
        and stock history keep their links.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - catalog
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductImageRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
    delete:
      operationId: catalog_products_image_destroy
      description: Admin catalogue. Products are deactivated, never deleted, so sales
        and stock history keep their links.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /api/v1/catalog/tax-rules/:
    get:
      operationId: catalog_tax_rules_list
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxRule'
          description: ''
  /api/v1/inventory/adjustments/:
    post:
      operationId: inventory_adjustments_create
      description: Record a manual adjustment (add, remove or counted quantity) as
        one stock movement.
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAdjustmentResult'
          description: ''
  /api/v1/inventory/movements/:
    get:
      operationId: inventory_movements_list
      description: 'The stock ledger, newest first. Read-only: movements are never
        edited or deleted.'
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: On or after (store time)
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: On or before (store time)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Product name, variant SKU or reference
      - in: query
        name: type
        schema:
          type: string
          enum:
          - adjust_add
          - adjust_remove
          - count
          - opening
          - purchase
          - return
          - sale
        description: |-
          * `opening` - Opening stock
          * `purchase` - Purchase received
          * `sale` - Sale
          * `return` - Customer return
          * `adjust_add` - Adjustment (add)
          * `adjust_remove` - Adjustment (remove)
          * `count` - Stock count
      - in: query
        name: variant
        schema:
          type: number
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventoryMovementList'
          description: ''
  /api/v1/inventory/summary/:
    get:
      operationId: inventory_summary_retrieve
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySummary'
          description: ''
  /api/v1/inventory/variants/:
    get:
      operationId: inventory_variants_list
      description: Variant-level stock for every product, active or not, so stock
        on deactivated items stays visible.
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -moved
            - -product
            - -stock
            - moved
            - product
            - stock
        description: |-
          Ordering

          * `product` - Product
          * `-product` - Product (descending)
          * `stock` - Stock
          * `-stock` - Stock (descending)
          * `moved` - Moved
          * `-moved` - Moved (descending)
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Product name or SKU, variant SKU, or exact barcode
      - in: query
        name: state
        schema:
          type: string
          enum:
          - in_stock
          - low_stock
          - out_of_stock
        description: |-
          * `in_stock` - In stock
          * `low_stock` - Low stock
          * `out_of_stock` - Out of stock
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - inactive
        description: |-
          * `active` - Sellable
          * `inactive` - Inactive variant or product
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventoryVariantList'
          description: ''
  /api/v1/inventory/variants/{id}/:
    get:
      operationId: inventory_variants_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryVariant'
          description: ''
  /api/v1/sales/:
    get:
      operationId: sales_list
      description: |-
        GET: sales history, newest first. POST: complete a sale.

        The list is scoped like receipts: cashiers get their own sales, Senior cashiers and Admins get all.
      parameters:
      - in: query
        name: cashier
        schema:
          type: number
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: On or after (store time)
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: On or before (store time)
      - in: query
        name: method
        schema:
          type: string
          enum:
          - card
          - cash
          - upi
        description: |-
          * `cash` - Cash
          * `upi` - UPI
          * `card` - Card
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Invoice number (or part of it)
      - in: query
        name: status
        schema:
          type: string
          enum:
          - completed
        description: '* `completed` - Completed'
      tags:
      - sales
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSaleListItemList'
          description: ''
    post:
      operationId: sales_create
      description: Complete a sale. 201 when written; 200 when the same Idempotency-Key
        was already used for this bill.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: UUID made when the payment step opens. Retrying with the same
          key returns the original sale.
        required: true
      tags:
      - sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
          description: ''
  /api/v1/sales/{invoice_no}/:
    get:
      operationId: sales_retrieve
      description: A saved sale, for the receipt. Cashiers see their own sales; Senior
        cashiers and Admins see all.
      parameters:
      - in: path
        name: invoice_no
        schema:
          type: string
        required: true
      tags:
      - sales
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
          description: ''
  /api/v1/sales/cashiers/:
    get:
      operationId: sales_cashiers_list
      description: Staff who have recorded at least one sale, including deactivated
        accounts, for the cashier filter.
      tags:
      - sales
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleCashier'
          description: ''
  /api/v1/sales/quote/:
    post:
      operationId: sales_quote_create
      description: Price a bill without saving anything. The bill panel shows these
        figures, never its own.
      tags:
      - sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BillRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BillRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          description: ''
  /api/v1/sales/summary/:
    get:
      operationId: sales_summary_retrieve
      description: |-
        Admin summary of completed sales matching the same filters as the list.

        Totals are the saved bill totals (after discounts, GST included). UPI and card amounts are what the
        cashier recorded; none is gateway-verified, so this is not a settlement figure. Returns are not
        deducted yet because the returns module does not exist.
      parameters:
      - in: query
        name: cashier
        schema:
          type: integer
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: On or after (store time)
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: On or before (store time)
      - in: query
        name: method
        schema:
          type: string
          enum:
          - card
          - cash
          - upi
      - in: query
        name: q
        schema:
          type: string
        description: Invoice number (or part of it)
      tags:
      - sales
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesSummary'
          description: ''
  /api/v1/store/:
    get:
      operationId: store_retrieve
      description: Read-only store identity for the admin sidebar. Editing belongs
        to the Settings phase.
      tags:
      - store
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
          description: ''
components:
  schemas:
    Approver:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - full_name
      - id
      - role
    BillLineInputRequest:
      type: object
      properties:
        variant:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 999
          minimum: 1
      required:
      - quantity
      - variant
    BillRequest:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BillLineInputRequest'
        discount:
          allOf:
          - $ref: '#/components/schemas/DiscountInputRequest'
          nullable: true
      required:
      - lines
    BillingCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    BillingSettings:
      type: object
      description: What the till needs to know about the store. No GSTIN, address
        or other admin settings.
      properties:
        store_name:
          type: string
        store_code:
          type: string
        prices_include_tax:
          type: boolean
        cashier_discount_limit_pct:
          type: integer
      required:
      - cashier_discount_limit_pct
      - prices_include_tax
      - store_code
      - store_name
    CashierSummary:
      type: object
      properties:
        sale_count:
          type: integer
        total_paise:
          type: integer
        cashier:
          type: integer
        cashier_name:
          type: string
      required:
      - cashier
      - cashier_name
      - sale_count
      - total_paise
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        hsn_code:
          type: string
          readOnly: true
        tax_rule:
          allOf:
          - $ref: '#/components/schemas/TaxRule'
          readOnly: true
      required:
      - hsn_code
      - id
      - name
      - tax_rule
    CategoryRef:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    CheckoutRequest:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BillLineInputRequest'
        discount:
          allOf:
          - $ref: '#/components/schemas/DiscountInputRequest'
          nullable: true
        payment:
          $ref: '#/components/schemas/PaymentInputRequest'
        expected_total_paise:
          type: integer
          minimum: 0
        approver_id:
          type: integer
          nullable: true
        approval_pin:
          writeOnly: true
          oneOf:
          - type: string
            pattern: ^\d{4,6}$
          - type: string
            maxLength: 0
      required:
      - expected_total_paise
      - lines
      - payment
    DaySummary:
      type: object
      properties:
        sale_count:
          type: integer
        total_paise:
          type: integer
        date:
