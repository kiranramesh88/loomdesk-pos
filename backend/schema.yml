    PatchedProductWriteRequest:
      type: object
      description: |-
        Create or update a product and its variants in one atomic request.

        Stock is never edited here. New variants may carry opening stock, which is recorded as an
        OPENING movement through inventory.services.record_movement (the only path that changes stock).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sku:
          type: string
          minLength: 1
          maxLength: 40
        description:
          type: string
        category:
          type: integer
        base_price_paise:
          type: integer
          maximum: 1000000000
          minimum: 1
        cost_price_paise:
          type: integer
          maximum: 1000000000
          minimum: 0
          nullable: true
        hsn_code:
          type: string
          maxLength: 8
        tax_rule:
          type: integer
          nullable: true
        status:
