openapi: 3.0.3
info:
  title: LoomDesk POS API
  version: 1.0.0
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the csrftoken cookie so the SPA can make its first unsafe
        request (login).
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/session/:
    get:
      operationId: auth_session_retrieve
      description: |-
        Who is signed in, if anyone. Always 200 so the app's startup check isn't an error.

        Anonymous callers learn nothing beyond `user: null`; protected endpoints, including
        `me/`, still refuse them. Also sets the csrftoken cookie, so login needs no extra request.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/set-password/:
    post:
      operationId: auth_set_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/set-password/{uid}/{token}/:
    get:
      operationId: auth_set_password_retrieve
      description: Check a set-password link before showing the form. Throttled like
        sign-in.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetPasswordLink'
          description: ''
  /api/v1/billing/approvers/:
    get:
      operationId: billing_approvers_list
      description: Who can approve a discount above a cashier's limit.
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Approver'
          description: ''
  /api/v1/billing/categories/:
    get:
      operationId: billing_categories_list
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BillingCategory'
          description: ''
  /api/v1/billing/products/:
    get:
      operationId: billing_products_list
      description: |-
        What the till can sell: active products with at least one active variant, and only those variants.

        Separate from the admin catalogue (which shows cost prices and inactive items) so cashiers see
        nothing beyond what they need to bill.
      parameters:
      - in: query
        name: category
        schema:
          type: number
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Name, SKU or exact barcode
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSellableProductList'
          description: ''
  /api/v1/billing/settings/:
    get:
      operationId: billing_settings_retrieve
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSettings'
          description: ''
  /api/v1/catalog/categories/:
    get:
      operationId: catalog_categories_list
      description: Categories with their HSN code and tax rule, for the product form
        and catalogue filter.
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/catalog/products/:
    get:
      operationId: catalog_products_list
      description: Admin catalogue. Products are deactivated, never deleted, so sales
        and stock history keep their links.
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -name
            - -price
            - -sku
            - -stock
            - -updated
            - name
            - price
            - sku
            - stock
            - updated
        description: |-
          Ordering

          * `name` - Name
          * `-name` - Name (descending)
          * `sku` - Sku
          * `-sku` - Sku (descending)
          * `price` - Price
          * `-price` - Price (descending)
          * `stock` - Stock
          * `-stock` - Stock (descending)
          * `updated` - Updated
          * `-updated` - Updated (descending)
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Name, product or variant SKU, or barcode
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - inactive
        description: |-
          * `active` - Active
          * `inactive` - Inactive
      - in: query
        name: stock
        schema:
          type: string
          enum:
          - in_stock
          - low_stock
          - out_of_stock
        description: |-
          * `in_stock` - In stock
          * `low_stock` - Low stock
          * `out_of_stock` - Out of stock
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
    post:
      operationId: catalog_products_create
      description: Admin catalogue. Products are deactivated, never deleted, so sales
        and stock history keep their links.
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /api/v1/catalog/products/{id}/:
    get:
      operationId: catalog_products_retrieve
      description: Admin catalogue. Products are deactivated, never deleted, so sales
        and stock history keep their links.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
    patch:
      operationId: catalog_products_partial_update
      description: Admin catalogue. Products are deactivated, never deleted, so sales
        and stock history keep their links.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /api/v1/catalog/products/{id}/image/:
    post:
      operationId: catalog_products_image_create
      description: Admin catalogue. Products are deactivated, never deleted, so sales
        and stock history keep their links.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - catalog
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductImageRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
    delete:
      operationId: catalog_products_image_destroy
      description: Admin catalogue. Products are deactivated, never deleted, so sales
        and stock history keep their links.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /api/v1/catalog/tax-rules/:
    get:
      operationId: catalog_tax_rules_list
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxRule'
          description: ''
  /api/v1/inventory/adjustments/:
    post:
      operationId: inventory_adjustments_create
      description: Record a manual adjustment (add, remove or counted quantity) as
        one stock movement.
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAdjustmentResult'
          description: ''
  /api/v1/inventory/movements/:
    get:
      operationId: inventory_movements_list
      description: 'The stock ledger, newest first. Read-only: movements are never
        edited or deleted.'
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: On or after (store time)
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: On or before (store time)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Product name, variant SKU or reference
      - in: query
        name: type
        schema:
          type: string
          enum:
          - adjust_add
          - adjust_remove
          - count
          - opening
          - purchase
          - return
          - sale
          - void
        description: |-
          * `opening` - Opening stock
          * `purchase` - Purchase received
          * `sale` - Sale
          * `return` - Customer return
          * `void` - Sale voided
          * `adjust_add` - Adjustment (add)
          * `adjust_remove` - Adjustment (remove)
          * `count` - Stock count
      - in: query
        name: variant
        schema:
          type: number
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventoryMovementList'
          description: ''
  /api/v1/inventory/summary/:
    get:
      operationId: inventory_summary_retrieve
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySummary'
          description: ''
  /api/v1/inventory/variants/:
    get:
      operationId: inventory_variants_list
      description: Variant-level stock for every product, active or not, so stock
        on deactivated items stays visible.
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -moved
            - -product
            - -stock
            - moved
            - product
            - stock
        description: |-
          Ordering

          * `product` - Product
          * `-product` - Product (descending)
          * `stock` - Stock
          * `-stock` - Stock (descending)
          * `moved` - Moved
          * `-moved` - Moved (descending)
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Product name or SKU, variant SKU, or exact barcode
      - in: query
        name: state
        schema:
          type: string
          enum:
          - in_stock
          - low_stock
          - out_of_stock
        description: |-
          * `in_stock` - In stock
          * `low_stock` - Low stock
          * `out_of_stock` - Out of stock
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - inactive
        description: |-
          * `active` - Sellable
          * `inactive` - Inactive variant or product
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventoryVariantList'
          description: ''
  /api/v1/inventory/variants/{id}/:
    get:
      operationId: inventory_variants_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryVariant'
          description: ''
  /api/v1/reports/:
    get:
      operationId: reports_list
      description: 'The reports that exist. All are admin-only: they show cost prices,
        staff figures and refunds.'
      tags:
      - reports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportListItem'
          description: ''
  /api/v1/reports/{key}/:
    get:
      operationId: reports_retrieve
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: 'Activity log: an audit action'
      - in: query
        name: category
        schema:
          type: string
        description: 'Sales by product, inventory valuation, low stock: a category
          id'
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: 'First store date (default: 30 days before date_to)'
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: 'Last store date (default: today)'
      - in: path
        name: key
        schema:
          type: string
        required: true
      - in: query
        name: reason
        schema:
          type: string
        description: 'Returns & refunds: a return reason'
      - in: query
        name: state
        schema:
          type: string
        description: 'Low stock: low_stock or out_of_stock'
      tags:
      - reports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
          description: ''
  /api/v1/reports/{key}/export/:
    get:
      operationId: reports_export_retrieve
      description: The report's table as a CSV download, with the same dates and filters.
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: 'Activity log: an audit action'
      - in: query
        name: category
        schema:
          type: string
        description: 'Sales by product, inventory valuation, low stock: a category
          id'
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: 'First store date (default: 30 days before date_to)'
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: 'Last store date (default: today)'
      - in: path
        name: key
        schema:
          type: string
        required: true
      - in: query
        name: reason
        schema:
          type: string
        description: 'Returns & refunds: a return reason'
      - in: query
        name: state
        schema:
          type: string
        description: 'Low stock: low_stock or out_of_stock'
      tags:
      - reports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
  /api/v1/returns/:
    get:
      operationId: returns_list
      description: 'GET: returns, newest first. POST: record a return and its refund.
        Admin only (decision D1).'
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: On or after (store time)
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: On or before (store time)
      - in: query
        name: disposition
        schema:
          type: string
          enum:
          - damaged
          - inspection
          - sellable
        description: |-
          * `sellable` - Back to stock
          * `damaged` - Damaged
          * `inspection` - Inspection hold
      - in: query
        name: method
        schema:
          type: string
          enum:
          - card
          - cash
          - upi
        description: |-
          * `cash` - Cash
          * `upi` - UPI
          * `card` - Card
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Return or invoice number (or part of it)
      tags:
      - returns
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReturnListItemList'
          description: ''
    post:
      operationId: returns_create
      description: Record a return. 201 when written; 200 when the same Idempotency-Key
        was already used for it.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: UUID made when the review step opens. Retrying with the same
          key returns the original return.
        required: true
      tags:
      - returns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReturnCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReturnCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
          description: ''
  /api/v1/returns/{number}/:
    get:
      operationId: returns_retrieve
      parameters:
      - in: path
        name: number
        schema:
          type: string
        required: true
      tags:
      - returns
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
          description: ''
  /api/v1/returns/invoice/{invoice_no}/:
    get:
      operationId: returns_invoice_retrieve
      description: A sale's lines with sold, already returned and still returnable
        quantities.
      parameters:
      - in: path
        name: invoice_no
        schema:
          type: string
        required: true
      tags:
      - returns
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnableSale'
          description: ''
  /api/v1/returns/quote/:
    post:
      operationId: returns_quote_create
      description: Work out a return's refund without saving anything, for the review
        step.
      tags:
      - returns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReturnRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReturnRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnQuote'
          description: ''
  /api/v1/sales/:
    get:
      operationId: sales_list
      description: |-
        GET: sales history, newest first. POST: complete a sale.

        The list is scoped like receipts: cashiers get their own sales, Senior cashiers and Admins get all.
      parameters:
      - in: query
        name: cashier
        schema:
          type: number
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: On or after (store time)
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: On or before (store time)
      - in: query
        name: method
        schema:
          type: string
          enum:
          - card
          - cash
          - upi
        description: |-
          * `cash` - Cash
