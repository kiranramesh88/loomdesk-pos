        on_hand:
          type: integer
          readOnly: true
        stock_state:
          allOf:
          - $ref: '#/components/schemas/StockStateEnum'
          readOnly: true
      required:
      - barcode
      - colour
      - id
      - on_hand
      - price_paise
      - size
      - sku
      - stock_state
    Session:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/Me'
          nullable: true
      required:
      - user
    StockAdjustmentKindEnum:
      enum:
      - add
      - remove
      - count
      type: string
      description: |-
        * `add` - Add stock
        * `remove` - Remove stock
        * `count` - Set counted quantity
    StockAdjustmentRequest:
      type: object
      properties:
        variant:
          type: integer
        kind:
          $ref: '#/components/schemas/StockAdjustmentKindEnum'
        quantity:
          type: integer
          maximum: 10000
          minimum: 0
          description: Units to add or remove, or the counted quantity.
        reason:
          type: string
          minLength: 1
          description: Why stock changed; recorded on the movement.
          maxLength: 200
        expected_on_hand:
          type: integer
          minimum: 0
          description: The on-hand figure the adjustment was previewed against.
      required:
      - expected_on_hand
      - kind
      - quantity
      - reason
      - variant
    StockAdjustmentResult:
      type: object
      properties:
        movement:
          $ref: '#/components/schemas/InventoryMovement'
        variant:
          $ref: '#/components/schemas/InventoryVariant'
      required:
      - movement
      - variant
    StockMovement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/StockMovementTypeEnum'
          readOnly: true
        type_label:
          type: string
          readOnly: true
        variant_label:
          type: string
          readOnly: true
        quantity_delta:
          type: integer
          readOnly: true
        balance_after:
          type: integer
          readOnly: true
        reason:
          type: string
          readOnly: true
        reference:
          type: string
          readOnly: true
        actor_name:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor_name
      - balance_after
      - created_at
      - id
      - quantity_delta
      - reason
      - reference
      - type
      - type_label
      - variant_label
    StockMovementTypeEnum:
      enum:
      - opening
      - purchase
      - sale
      - return
      - adjust_add
      - adjust_remove
      - count
      type: string
      description: |-
        * `opening` - Opening stock
        * `purchase` - Purchase received
        * `sale` - Sale
        * `return` - Customer return
        * `adjust_add` - Adjustment (add)
        * `adjust_remove` - Adjustment (remove)
        * `count` - Stock count
    StockStateEnum:
      enum:
      - in_stock
      - low_stock
      - out_of_stock
      type: string
      description: |-
        * `in_stock` - in_stock
        * `low_stock` - low_stock
        * `out_of_stock` - out_of_stock
    Store:
      type: object
      description: Identity shown in the admin shell. Settings such as tax and discount
        limits are not exposed here.
      properties:
        name:
          type: string
          readOnly: true
        code:
          type: string
          readOnly: true
        state:
          type: string
          readOnly: true
      required:
      - code
      - name
      - state
    TaxBreakdown:
      type: object
      properties:
        rate_bp:
          type: integer
        taxable_paise:
          type: integer
        tax_paise:
          type: integer
        cgst_paise:
          type: integer
        sgst_paise:
          type: integer
      required:
      - cgst_paise
      - rate_bp
      - sgst_paise
      - tax_paise
      - taxable_paise
    TaxRule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/TaxRuleKindEnum'
          readOnly: true
        flat_rate_bp:
          type: integer
          readOnly: true
          nullable: true
        threshold_paise:
          type: integer
          readOnly: true
          nullable: true
        lower_rate_bp:
          type: integer
          readOnly: true
          nullable: true
        upper_rate_bp:
          type: integer
          readOnly: true
          nullable: true
        summary:
          type: string
          description: Plain-language rate, e.g. "5% up to ₹2,500 per unit, 18% above".
          readOnly: true
      required:
      - flat_rate_bp
      - id
      - kind
      - lower_rate_bp
      - name
      - summary
      - threshold_paise
      - upper_rate_bp
    TaxRuleKindEnum:
      enum:
      - flat
      - price_band
      type: string
      description: |-
        * `flat` - Flat rate
        * `price_band` - Price band
    Variant:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        size:
          type: string
          readOnly: true
        colour:
          type: string
          readOnly: true
        sku:
          type: string
          readOnly: true
        barcode:
          type: string
          readOnly: true
          nullable: true
        price_override_paise:
          type: integer
          readOnly: true
          nullable: true
        price_paise:
          type: integer
          readOnly: true
        on_hand:
          type: integer
          readOnly: true
        reorder_level:
          type: integer
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        stock_state:
          allOf:
          - $ref: '#/components/schemas/StockStateEnum'
          readOnly: true
        has_history:
          type: boolean
          readOnly: true
      required:
      - barcode
      - colour
      - has_history
      - id
      - is_active
      - on_hand
      - price_override_paise
      - price_paise
      - reorder_level
      - size
      - sku
      - stock_state
    VariantWriteRequest:
      type: object
      properties:
        id:
          type: integer
        size:
          type: string
          minLength: 1
          maxLength: 20
        colour:
          type: string
          minLength: 1
          maxLength: 30
        sku:
          type: string
          minLength: 1
          maxLength: 40
        barcode:
          type: string
          nullable: true
          maxLength: 32
        price_override_paise:
          type: integer
          maximum: 1000000000
          minimum: 1
          nullable: true
        reorder_level:
          type: integer
          maximum: 10000
          minimum: 0
          default: 2
        is_active:
          type: boolean
          default: true
        opening_stock:
          type: integer
          maximum: 100000
          minimum: 0
          default: 0
      required:
      - colour
      - size
      - sku
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
