# Tests and the production image on every push. Builds the image only; it never pushes or deploys it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loomdesk_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: loomdesk
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U loomdesk_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A throwaway CI database; the tests create and drop test_loomdesk in it.
      POSTGRES_DB: loomdesk
      POSTGRES_USER: loomdesk_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - run: pip install -r requirements-dev.txt
      - name: Tests on PostgreSQL, including the concurrency tests
        run: python -m pytest -q
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: The committed API schema is current
        run: |
          python manage.py spectacular --file /tmp/schema.yml --validate
          diff -u schema.yml /tmp/schema.yml

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run --maxWorkers=4
      - run: npm run build

  image:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loomdesk_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: loomdesk
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U loomdesk_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t loomdesk:ci .
      - name: The image holds no local secrets or data
        run: |
          docker run --rm --entrypoint sh loomdesk:ci -c '
            ! find /app \( -name ".env" -o -name "*.sqlite3" -o -name "*.dump" \) | grep . &&
            test -f /app/frontend/dist/index.html &&
            ls /app/backend/staticfiles/assets | grep -q "\.js$"'
      - name: The start script refuses to run without the proxy setting
        run: |
          ! docker run --rm -e DJANGO_SECRET_KEY=x -e DJANGO_ALLOWED_HOSTS=x loomdesk:ci 2>err.txt
          grep -q "WAITRESS_TRUSTED_PROXY" err.txt
      - name: Free-plan start-up, twice, the second time with no media (as after a Render free restart)
        run: |
          set -eu
          secret=$(python3 -c "import secrets; print(secrets.token_urlsafe(64))")
          export SMOKE_ADMIN_PASSWORD="ci-$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          start() {
            docker run -d --name app --network host \
              -e PORT=8000 -e DJANGO_SECRET_KEY="$secret" -e DJANGO_ALLOWED_HOSTS=localhost \
              -e WAITRESS_TRUSTED_PROXY=127.0.0.1 \
              -e POSTGRES_HOST=localhost -e POSTGRES_DB=loomdesk -e POSTGRES_USER=loomdesk_ci -e POSTGRES_PASSWORD=ci-only-password \
              -e LOOMDESK_MIGRATE_ON_START=true -e LOOMDESK_DEMO_STORE=true \
              -e LOOMDESK_ADMIN_EMAIL=ci-admin@example.com -e LOOMDESK_ADMIN_PASSWORD="$SMOKE_ADMIN_PASSWORD" \
              loomdesk:ci > /dev/null
            for _ in $(seq 90); do
              curl -fsS -o /dev/null -H "X-Forwarded-Proto: https" http://localhost:8000/api/v1/auth/session/ && return 0
              sleep 2
            done
            docker logs app; return 1
          }
          smoke() {
            python3 deploy/smoke_test.py http://localhost:8000 --forwarded-proto https \
              --admin-email ci-admin@example.com --admin-password-env SMOKE_ADMIN_PASSWORD --min-products 9 --min-photos 1
          }
          start; smoke
          docker logs app 2>&1 | grep -q "Demo catalogue loaded"
          docker logs app 2>&1 | grep -q "Created Admin account for ci-admin@example.com"
          # The server runs unprivileged and never holds the admin password.
          test "$(docker exec app awk '/^Uid:/ {print $2}' /proc/1/status)" = "$(docker exec app id -u loomdesk)"
          test "$(docker exec app sh -c "tr '\0' '\n' < /proc/1/environ | grep -c '^LOOMDESK_ADMIN_PASSWORD=' || true")" = 0
          # A new container keeps the database but loses every media file, like a free restart.
          docker rm -f app > /dev/null
          start; smoke
          docker logs app 2>&1 | grep -q "the demo catalogue wasn't loaded"
          docker logs app 2>&1 | grep -q "already exists; left unchanged"
          docker logs app 2>&1 | grep -Eq "Demo photos restored: [1-9]"
          docker rm -f app > /dev/null
